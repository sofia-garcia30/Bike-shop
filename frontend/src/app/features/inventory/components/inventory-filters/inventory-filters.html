<div class="filters">
  <div class="filters__header">
    <h3>Filters</h3>
    <p>Refine inventory</p>
  </div>

  <div class="filters__group">
    <h4>Brand</h4>
    <label><input type="checkbox" checked> All Brands</label>
    <label><input type="checkbox"> Specialized</label>
    <label><input type="checkbox"> Trek</label>
    <label><input type="checkbox"> Cannondale</label>
  </div>

  <div class="filters__group">
    <h4>Type</h4>
    <label><input type="checkbox"> MTB</label>
    <label><input type="checkbox"> Ruta</label>
    <label><input type="checkbox"> Urbana</label>
    <label><input type="checkbox"> Gravel</label>
  </div>

  <div class="filters__group">
    <h4>Stock Status</h4>
    <label><input type="checkbox" checked> In Stock</label>
    <label><input type="checkbox"> Low Stock</label>
  </div>

  <button class="filters__button">Apply Filters</button>
</div>
