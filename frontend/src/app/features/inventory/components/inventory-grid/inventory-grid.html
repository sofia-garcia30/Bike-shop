<div class="panel" style="padding: 1rem;">
  <p>Total productos: {{ products.length }}</p>

  @for (product of products; track product.codigo) {
  <div style="margin-bottom: 1rem; padding: 1rem; border: 1px solid #555;">
    <p><strong>Marca:</strong> {{ product.brand }}</p>
    <p><strong>Modelo:</strong> {{ product.model }}</p>
    <p><strong>Tipo:</strong> {{ product.type }}</p>
    <p><strong>Precio:</strong> {{ product.price | currency:'COP':'symbol':'1.0-0':'es-CO' }}</p>
    <p><strong>Stock:</strong> {{ product.stock }}</p>
  </div>
  }
</div>
