<section class="inventory-page">
  <div class="inventory-page__header">
    <div>
      <h1 class="inventory-page__title">STOCK DISPONIBLE</h1>
      <p class="inventory-page__subtitle">
        Se encontraron {{ inventoryGrid?.products?.length || 0 }} bicicletas registradas
      </p>
    </div>
    <div class="inventory-page__actions">
      <button class="inventory-page__filter-toggle" (click)="toggleFiltros()">
        FILTROS
      </button>
      <button class="inventory-page__sort-btn">
        ORDENAR: MÁS RECIENTES
      </button>
      <button class="inventory-page__new-btn" (click)="abrirFormulario()">
        + NUEVA BICICLETA
      </button>
    </div>
  </div>

  <div class="inventory-page__content">
    <app-inventory-grid></app-inventory-grid>
  </div>

  @if (mostrarFiltros) {
  <div class="inventory-page__overlay" (click)="cerrarFiltros()"></div>
  <aside class="inventory-page__drawer panel">
    <div class="inventory-page__drawer-header">
      <div>
        <h3>FILTROS</h3>
        <p>Refina el inventario</p>
      </div>
      <button class="inventory-page__close-btn" (click)="cerrarFiltros()">✕</button>
    </div>
    <div class="inventory-page__filter-group">
      <h4>Marca</h4>
      <button type="button" class="inventory-page__filter-btn"
              [class.inventory-page__filter-btn--active]="marcaSeleccionada === null"
              (click)="seleccionarMarca(null)">Todas</button>
      <button type="button" class="inventory-page__filter-btn"
              [class.inventory-page__filter-btn--active]="marcaSeleccionada === 'GW'"
              (click)="seleccionarMarca('GW')">GW</button>
    </div>
    <div class="inventory-page__filter-group">
      <h4>Tipo</h4>
      <button type="button" class="inventory-page__filter-btn"
              [class.inventory-page__filter-btn--active]="tipoSeleccionado === 'Montaña'"
              (click)="seleccionarTipo('Montaña')">Montaña</button>
    </div>
    <div class="inventory-page__filter-group">
      <h4>Estado de stock</h4>
      <button type="button" class="inventory-page__filter-btn"
              [class.inventory-page__filter-btn--active]="soloStockBajo"
              (click)="toggleStockBajo()">Stock bajo</button>
    </div>
    <div class="inventory-page__drawer-actions">
      <button class="inventory-page__clear-btn" (click)="limpiarFiltros()">Limpiar</button>
      <button class="inventory-page__apply-btn" (click)="aplicarFiltros()">Aplicar filtros</button>
    </div>
  </aside>
  }

  @if (mostrarFormulario) {
  <div class="inventory-page__overlay" (click)="cerrarFormulario()"></div>
  <div class="inventory-page__modal panel">
    <div class="inventory-page__drawer-header">
      <h3>{{ bicicletaEditando ? 'EDITAR' : 'NUEVA' }} BICICLETA</h3>
      <button class="inventory-page__close-btn" (click)="cerrarFormulario()">✕</button>
    </div>
    <form (ngSubmit)="guardarBicicleta()">
      <div class="inventory-page__form-group">
        <label>Marca</label>
        <input [(ngModel)]="form.marca" name="marca" required placeholder="Ej: Trek"/>
      </div>
      <div class="inventory-page__form-group">
        <label>Modelo</label>
        <input [(ngModel)]="form.modelo" name="modelo" required placeholder="Ej: Marlin 5"/>
      </div>
      <div class="inventory-page__form-group">
        <label>Tipo</label>
        <select [(ngModel)]="form.tipo" name="tipo">
          <option value="Montaña">Montaña</option>
          <option value="Ruta">Ruta</option>
          <option value="Urbana">Urbana</option>
        </select>
      </div>
      <div class="inventory-page__form-group">
        <label>Precio Costo</label>
        <input [(ngModel)]="form.precioCosto" name="precioCosto" type="number" required/>
      </div>
      <div class="inventory-page__form-group">
        <label>Precio Venta</label>
        <input [(ngModel)]="form.precioVenta" name="precioVenta" type="number" required/>
      </div>
      <div class="inventory-page__form-group">
        <label>Descripción</label>
        <input [(ngModel)]="form.descripcion" name="descripcion" placeholder="Opcional"/>
      </div>
      <div class="inventory-page__drawer-actions">
        <button type="button" class="inventory-page__clear-btn" (click)="cerrarFormulario()">
          Cancelar
        </button>
        <button type="submit" class="inventory-page__apply-btn">
          {{ bicicletaEditando ? 'Actualizar' : 'Crear' }}
        </button>
      </div>
    </form>
  </div>
  }

</section>
