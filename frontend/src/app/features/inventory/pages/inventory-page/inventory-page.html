<section class="inventory-page">
  <div class="inventory-page__header">
    <div>
      <p class="inventory-page__eyebrow">Kinetic Precision</p>
      <h1 class="page-title">Stock disponible</h1>
      <p class="page-subtitle">
        Gestión precisa del inventario. Monitorea disponibilidad, rotación y rendimiento de productos.
      </p>
    </div>

    <button class="btn-secondary inventory-page__sort">Ordenar: Más recientes</button>
  </div>

  <div class="inventory-page__filters panel">
    <button class="btn-secondary" (click)="filtrarTodas()">Todos</button>
    <button class="btn-secondary" (click)="filtrarMarcaGW()">Marca: GW</button>
    <button class="btn-secondary" (click)="filtrarTipoMontana()">Tipo: Montaña</button>
    <button class="btn-secondary" (click)="filtrarStockBajo()">Stock bajo</button>
  </div>

  <app-inventory-grid></app-inventory-grid>
</section>
