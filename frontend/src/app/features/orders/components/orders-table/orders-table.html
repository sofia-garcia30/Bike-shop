<section class="orders-table panel">
  <div class="orders-table__header">
    <h3>Órdenes activas</h3>
    <p>Seguimiento de pedidos registrados en el sistema</p>
  </div>

  <div class="orders-table__wrapper">
    <table class="orders-table__table">
      <thead>
      <tr>
        <th>Proveedor</th>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Fecha</th>
        <th>Estado</th>
      </tr>
      </thead>
      <tbody>
      @for (order of orders; track order.proveedor + order.fecha) {
      <tr>
        <td>{{ order.proveedor }}</td>
        <td>{{ order.producto }}</td>
        <td>{{ order.cantidad }}</td>
        <td>{{ order.fecha }}</td>
        <td>
              <span
                class="orders-table__badge"
                [class.orders-table__badge--pending]="order.estado === 'Pendiente'"
                [class.orders-table__badge--received]="order.estado === 'Recibido'">
                {{ order.estado }}
              </span>
        </td>
      </tr>
      }
      </tbody>
    </table>
  </div>
</section>
