<section class="procurement-form panel">
  <div class="procurement-form__header">
    <h3>Registrar pedido</h3>
    <p>Solicita reposición de inventario a proveedores autorizados</p>
  </div>

  <form class="procurement-form__body">
    <div class="procurement-form__group">
      <label>Proveedor</label>
      <input type="text" placeholder="Nombre del proveedor" />
    </div>

    <div class="procurement-form__group">
      <label>Producto</label>
      <input type="text" placeholder="Bicicleta o referencia" />
    </div>

    <div class="procurement-form__grid">
      <div class="procurement-form__group">
        <label>Cantidad</label>
        <input type="number" placeholder="0" />
      </div>

      <div class="procurement-form__group">
        <label>Fecha estimada</label>
        <input type="date" />
      </div>
    </div>

    <div class="procurement-form__group">
      <label>Observaciones</label>
      <textarea rows="4" placeholder="Notas del pedido"></textarea>
    </div>

    <div class="procurement-form__footer">
      <button type="button" class="procurement-form__secondary">Cancelar</button>
      <button type="submit" class="procurement-form__primary">Guardar pedido</button>
    </div>
  </form>
</section>
