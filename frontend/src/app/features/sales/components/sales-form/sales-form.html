<section class="sales-form panel">
  <div class="sales-form__header">
    <h3>Registrar venta</h3>
    <p>Ingresa la información de la operación comercial</p>
  </div>

  <form class="sales-form__body">
    <div class="sales-form__group">
      <label>Cliente</label>
      <input type="text" placeholder="Nombre o documento" />
    </div>

    <div class="sales-form__group">
      <label>Bicicleta</label>
      <input type="text" placeholder="Modelo seleccionado" />
    </div>

    <div class="sales-form__grid">
      <div class="sales-form__group">
        <label>Cantidad</label>
        <input type="number" placeholder="1" />
      </div>

      <div class="sales-form__group">
        <label>Precio unitario</label>
        <input type="text" placeholder="$ 0" />
      </div>
    </div>

    <div class="sales-form__group">
      <label>Observaciones</label>
      <textarea rows="4" placeholder="Detalles de la venta"></textarea>
    </div>

    <div class="sales-form__footer">
      <button type="button" class="sales-form__secondary">Cancelar</button>
      <button type="submit" class="sales-form__primary">Guardar venta</button>
    </div>
  </form>
</section>
