spring.application.name=tienda-bicicletas
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/tienda_bicicletas?...}
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:apppassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never
server.port=8080
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4